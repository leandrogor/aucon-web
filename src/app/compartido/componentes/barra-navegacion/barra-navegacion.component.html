<nav class="barra-nav" [class.barra-nav--scrolled]="esScrolled()" [style.--nav-bg]="colorFondo()">
  <div class="barra-nav__contenido">
    <!-- Logo -->
    <a routerLink="/" class="barra-nav__logo">
      <img [src]="rutaLogo()" alt="Aucon Logo" class="barra-nav__logo-img" />
    </a>

    <!-- Desktop links -->
    <ul class="barra-nav__enlaces">
      @for (enlace of enlaces(); track enlace.fragmento) {
        <li>
          <button class="barra-nav__enlace" type="button" (click)="irASeccion(enlace.fragmento)">
            {{ enlace.etiqueta }}
          </button>
        </li>
      }
      <!-- Theme Switcher Desktop -->
      <li>
        <button
          class="barra-nav__tema-toggle"
          type="button"
          (click)="alternarTema()"
          [attr.aria-label]="tema.esOscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          [attr.aria-checked]="tema.esOscuro()"
          role="switch"
        >
          @if (tema.esOscuro()) {
            <!-- Sun icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="18"
              height="18"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
          } @else {
            <!-- Moon icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="18"
              height="18"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          }
        </button>
      </li>
    </ul>

    <!-- Hamburger button -->
    <button
      class="barra-nav__hamburguesa"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
    >
      <span class="barra-nav__hamburguesa-texto">Menú</span>
      @if (!menuAbierto()) {
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="24"
          height="24"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      } @else {
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="24"
          height="24"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      }
    </button>
  </div>

  <!-- Mobile menu -->
  @if (menuAbierto()) {
    <ul class="barra-nav__menu-movil">
      @for (enlace of enlaces(); track enlace.fragmento) {
        <li>
          <button
            class="barra-nav__enlace-movil"
            type="button"
            (click)="irASeccion(enlace.fragmento)"
          >
            {{ enlace.etiqueta }}
          </button>
        </li>
      }
      <!-- Theme Switcher Mobile -->
      <li class="barra-nav__menu-movil-tema">
        <button class="barra-nav__enlace-movil-tema-btn" type="button" (click)="alternarTema()">
          <span>Modo Oscuro</span>
          <div
            class="barra-nav__switch-switch"
            [class.barra-nav__switch-switch--active]="tema.esOscuro()"
          >
            <div class="barra-nav__switch-thumb"></div>
          </div>
        </button>
      </li>
    </ul>
  }
</nav>
