<main class="pagina-inicio">
  <div class="hero-contenedor">
    <!-- Card A: Ingeniería -->
    <a routerLink="/ingenieria" class="hero-tarjeta hero-tarjeta--ingenieria">
      <div class="hero-tarjeta__contenido">
        <img
          src="assets/images/general/logo-ingenieria-vertical.png"
          alt="Aucon Ingeniería Logo"
          class="hero-tarjeta__logo"
        />
        <div class="hero-tarjeta__textos">
          <span class="hero-tarjeta__division">Aucon | Ingeniería Industrial</span>
          <h1 class="hero-tarjeta__titulo font-display">Automatización y Control</h1>
          <span class="hero-tarjeta__cta">
            Ingresar
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="20"
              height="20"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
        </div>
      </div>
    </a>

    <!-- Card B: Sustentable -->
    <a routerLink="/sustentable" class="hero-tarjeta hero-tarjeta--sustentable">
      <div class="hero-tarjeta__contenido">
        <img
          src="assets/images/general/logo-sustentable-vertical.png"
          alt="Aucon Sustentable Logo"
          class="hero-tarjeta__logo"
        />
        <div class="hero-tarjeta__textos">
          <span class="hero-tarjeta__division">Aucon | Energía Sustentable</span>
          <h2 class="hero-tarjeta__titulo font-display">Energías Renovables</h2>
          <span class="hero-tarjeta__cta">
            Ingresar
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="20"
              height="20"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
        </div>
      </div>
    </a>
  </div>
</main>
